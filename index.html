<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Job Log System</title>

  <!-- PWA Manifest & Android Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- iOS Safari Standalone App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Job Log">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f1f5f9;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="loader" id="appLoader">
    <div class="spinner"></div>
    <div style="font-size: 0.95rem; font-weight: 600;">Loading Job Log System...</div>
  </div>

  <iframe
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbyRMVfEZ2SZhHpOea_fx2LQSq5Fb5fiPgxAD1IWBshhw17KuS1zEsFehkGBc_JEEskJwQ/exec"
    allow="geolocation; camera; microphone"
    onload="document.getElementById('appLoader').classList.add('hidden')">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch((err) => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
